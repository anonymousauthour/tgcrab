[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Coder <gugabuba1337@proton.me>"]
description = "Unofficial Telegram client for the terminal"
homepage = "https://github.com/anonymousauthour/tgcrab"
repository = "https://github.com/anonymousauthour/tgcrab"
rust-version = "1.77"

[workspace.dependencies]
tgcrab-core = { path = "crates/core" }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
directories = "6"
clap = { version = "4", features = ["derive"] }
